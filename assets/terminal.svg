<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <defs>
    <style>
      .terminal {
        font-family: 'Fira Code', 'JetBrains Mono', Monaco, Consolas, monospace;
      }
      .bg {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 1.5;
        rx: 10px;
      }
      .header-bg {
        fill: #161b22;
      }
      .btn-red { fill: #ff5f56; }
      .btn-yellow { fill: #ffbd2e; }
      .btn-green { fill: #27c93f; }
      .title {
        fill: #8b949e;
        font-size: 13px;
        text-anchor: middle;
      }
      .prompt {
        fill: #39d353;
        font-size: 15px;
        font-weight: 600;
      }
      .cmd {
        fill: #c9d1d9;
        font-size: 15px;
      }
      .output {
        fill: #58a6ff;
        font-size: 16px;
        font-weight: 600;
      }
      .log {
        fill: #8b949e;
        font-size: 14px;
      }
      .cursor {
        fill: #58a6ff;
      }
      .pct {
        fill: #58a6ff;
        font-size: 16px;
        font-weight: bold;
      }
    </style>
  </defs>

  <!-- Window Border and Background -->
  <rect class="bg" width="760" height="300" />
  
  <!-- Header Bar -->
  <path class="header-bg" d="M 1.5,10 A 10,10 0 0,1 11.5,1.5 L 748.5,1.5 A 10,10 0 0,1 758.5,10 L 758.5,40 L 1.5,40 Z" />
  <line x1="1.5" y1="40" x2="758.5" y2="40" stroke="#30363d" stroke-width="1.5" />

  <!-- macOS Style Window Buttons -->
  <circle class="btn-red" cx="25" cy="21" r="6" />
  <circle class="btn-yellow" cx="45" cy="21" r="6" />
  <circle class="btn-green" cx="65" cy="21" r="6" />
  
  <!-- Window Header Title -->
  <text class="title terminal" x="380" y="26">rahulnaikmudavath@github: ~</text>
  
  <!-- Terminal Content Group -->
  <g class="terminal" transform="translate(35, 85)">
    
    <!-- Row 1: Command Prompt and Command -->
    <text class="prompt" x="0" y="0">rahulnaikmudavath@github:~$ <tspan class="cmd">./build_future.sh</tspan></text>
    
    <!-- Typing Overlay Box: covers the command and shrinks to reveal it -->
    <rect x="238" y="-16" width="160" height="22" fill="#0d1117">
      <animate attributeName="width" values="160;160;0;0;160" keyTimes="0;0.1;0.4;0.9;1" dur="5s" repeatCount="indefinite" />
    </rect>
    
    <!-- Blinking Cursor -->
    <rect class="cursor" y="-14" width="8" height="17">
      <animate attributeName="x" values="238;238;398;398;238" keyTimes="0;0.1;0.4;0.9;1" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1;0;1" dur="0.8s" repeatCount="indefinite" />
    </rect>

    <!-- Row 2: Progress Bar Wrapper -->
    <!-- Brackets -->
    <text class="output" x="0" y="45">[<tspan x="264">]</tspan></text>
    
    <!-- Progress Bar Segments (Fading in one by one) -->
    <!-- Segment 1 -->
    <rect x="15" y="30" width="18" height="16" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.43;0.44;0.9;1" dur="5s" repeatCount="indefinite" />
    </rect>
    <!-- Segment 2 -->
    <rect x="35" y="30" width="18" height="16" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.46;0.47;0.9;1" dur="5s" repeatCount="indefinite" />
    </rect>
    <!-- Segment 3 -->
    <rect x="55" y="30" width="18" height="16" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.49;0.50;0.9;1" dur="5s" repeatCount="indefinite" />
    </rect>
    <!-- Segment 4 -->
    <rect x="75" y="30" width="18" height="16" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.52;0.53;0.9;1" dur="5s" repeatCount="indefinite" />
    </rect>
    <!-- Segment 5 -->
    <rect x="95" y="30" width="18" height="16" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.56;0.9;1" dur="5s" repeatCount="indefinite" />
    </rect>
    <!-- Segment 6 -->
    <rect x="115" y="30" width="18" height="16" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.59;0.9;1" dur="5s" repeatCount="indefinite" />
    </rect>
    <!-- Segment 7 -->
    <rect x="135" y="30" width="18" height="16" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.61;0.62;0.9;1" dur="5s" repeatCount="indefinite" />
    </rect>
    <!-- Segment 8 -->
    <rect x="155" y="30" width="18" height="16" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.65;0.9;1" dur="5s" repeatCount="indefinite" />
    </rect>
    <!-- Segment 9 -->
    <rect x="175" y="30" width="18" height="16" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.67;0.68;0.9;1" dur="5s" repeatCount="indefinite" />
    </rect>
    <!-- Segment 10 -->
    <rect x="195" y="30" width="18" height="16" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.70;0.71;0.9;1" dur="5s" repeatCount="indefinite" />
    </rect>
    <!-- Segment 11 -->
    <rect x="215" y="30" width="18" height="16" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.73;0.74;0.9;1" dur="5s" repeatCount="indefinite" />
    </rect>
    <!-- Segment 12 -->
    <rect x="235" y="30" width="18" height="16" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.76;0.77;0.9;1" dur="5s" repeatCount="indefinite" />
    </rect>

    <!-- Percentage counter text -->
    <text class="pct" x="282" y="45" opacity="0">
      0%
      <animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.43;0.44;0.9;1" dur="5s" repeatCount="indefinite" />
    </text>
    <text class="pct" x="282" y="45" opacity="0">
      12%
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.43;0.44;0.49;0.50;1" dur="5s" repeatCount="indefinite" />
    </text>
    <text class="pct" x="282" y="45" opacity="0">
      35%
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.50;0.58;0.59;1" dur="5s" repeatCount="indefinite" />
    </text>
    <text class="pct" x="282" y="45" opacity="0">
      58%
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.59;0.67;0.68;1" dur="5s" repeatCount="indefinite" />
    </text>
    <text class="pct" x="282" y="45" opacity="0">
      75%
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.67;0.68;0.76;0.77;1" dur="5s" repeatCount="indefinite" />
    </text>
    <text class="pct" x="282" y="45" opacity="0">
      100%
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.76;0.77;0.90;1" dur="5s" repeatCount="indefinite" />
    </text>
    
    <!-- Console Logs showing after progress completes -->
    <g class="log">
      <!-- Log line 1 -->
      <text x="0" y="90" opacity="0">
        &gt; Initializing neural structures... Done
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.79;0.80;0.90;1" dur="5s" repeatCount="indefinite" />
      </text>
      <!-- Log line 2 -->
      <text x="0" y="115" opacity="0">
        &gt; Building full-stack workflow engine... Active
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.82;0.83;0.90;1" dur="5s" repeatCount="indefinite" />
      </text>
      <!-- Log line 3 -->
      <text x="0" y="140" opacity="0" fill="#39d353" font-weight="600">
        &gt; Status: Ready to build the future.
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.85;0.86;0.90;1" dur="5s" repeatCount="indefinite" />
      </text>
    </g>

  </g>
</svg>
